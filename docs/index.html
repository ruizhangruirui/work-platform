<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta http-equiv="refresh" content="3;url=https://team-workbench-internal.zhangruisomebody.chatgpt.site" />
    <title>Team Workbench</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#18212f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #e5e8ec;border-radius:12px;padding:42px;text-align:center;box-shadow:0 14px 40px rgba(24,33,47,.08)}.mark{width:54px;height:54px;margin:0 auto 20px;display:grid;place-items:center;border-radius:10px;background:#4457c4;color:#fff;font-weight:800;font-size:18px}h1{font-size:25px;margin:0 0 8px}p{color:#667085;line-height:1.65;margin:0 0 24px}.button{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 20px;border-radius:7px;background:#4457c4;color:#fff;text-decoration:none;font-weight:650}.button:hover{background:#3547b2}.language{margin-top:18px;font-size:12px;color:#8a93a2}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16825d;margin-right:6px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">TW</div>
      <h1>Team Workbench</h1>
      <p>正在打开团队工作台…<br />Opening your team operations workspace…</p>
